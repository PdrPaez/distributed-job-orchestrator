services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    profiles: [full]
    build:
      context: ./backend
    environment:
      DATABASE_URL: sqlite:////data/jobs.db
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      CORS_ORIGINS: http://localhost:5173
    volumes:
      - backend-data:/data
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy

  worker:
    profiles: [full]
    build:
      context: ./backend
    command: celery -A app.worker.celery_app worker --loglevel=INFO --concurrency=1 --hostname=worker@%h
    environment:
      DATABASE_URL: sqlite:////data/jobs.db
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    volumes:
      - backend-data:/data
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_started

  frontend:
    profiles: [full]
    build:
      context: ./frontend
    command: npm run dev -- --host 0.0.0.0
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_started

volumes:
  backend-data:

