name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: cd-main
  cancel-in-progress: true

jobs:
  package:
    name: Package main delivery artifact
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend delivery bundle
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Assemble delivery package
        run: |
          mkdir -p release/backend release/frontend
          cp -R backend/app backend/pyproject.toml release/backend/
          cp -R frontend/dist/* release/frontend/
          cp README.md CHANGELOG.md LICENSE release/
          tar -czf distributed-job-orchestrator-${{ github.event.workflow_run.head_sha }}.tar.gz release
      - uses: actions/upload-artifact@v4
        with:
          name: distributed-job-orchestrator-${{ github.event.workflow_run.head_sha }}
          path: distributed-job-orchestrator-${{ github.event.workflow_run.head_sha }}.tar.gz
          if-no-files-found: error
          retention-days: 30
