name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
        working-directory: backend
      - run: python -m ruff check .
        working-directory: backend
      - run: python -m pytest -q
        working-directory: backend

  integration:
    name: Real integration and E2E smoke
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: python -m pip install -e "backend[dev]"
      - name: Start Redis
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y redis-server
          sudo systemctl start redis-server
          redis-cli ping
      - name: Start API and worker
        working-directory: backend
        run: |
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/djo-api.log 2>&1 &
          nohup celery -A app.worker.celery_app worker --loglevel=INFO --pool=solo > /tmp/djo-worker.log 2>&1 &
      - name: Wait for API
        run: curl --fail --retry 30 --retry-delay 1 --retry-connrefused http://127.0.0.1:8000/health
      - name: Execute real smoke flow
        env:
          DJO_API_URL: http://127.0.0.1:8000
        run: python scripts/smoke_test.py
      - name: Upload service logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-service-logs
          path: /tmp/djo-*.log

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm audit --audit-level=high
        working-directory: frontend

